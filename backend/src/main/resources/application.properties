spring.application.name=farm-marketplace
server.port=8081

# Default DataSource: In-Memory H2 with MySQL syntax compatibility
spring.datasource.url=jdbc:h2:mem:farmmarketdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JWT Configuration (at least 256 bits secret key)
application.security.jwt.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
application.security.jwt.expiration=86400000

# Seed demo data on startup if database is empty
app.seed-data=true

# Disable automatic SQL script runner (Hibernate ddl-auto handles schema)
spring.sql.init.mode=never
